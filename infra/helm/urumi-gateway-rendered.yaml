# Source: urumi-gateway/templates/ingress.yaml
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: urumi-gateway-ingress
  labels:
    app.kubernetes.io/instance: urumi-gateway
spec:
  ingressClassName: "nginx"
  rules:
    - host: "urumi.local"
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway-gateway
                port:
                  number: 4000
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway-gateway
                port:
                  number: 4000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: urumi-gateway-dashboard
                port:
                  number: 80
