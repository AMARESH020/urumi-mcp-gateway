# Source: urumi-gateway/templates/admin-bootstrap-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: urumi-gateway-admin-bootstrap
  labels:
    app.kubernetes.io/name: admin-bootstrap
    app.kubernetes.io/instance: urumi-gateway
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-bootstrap
        app.kubernetes.io/instance: urumi-gateway
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: "postgres:16-alpine"
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h urumi-gateway-postgres -p 5432 -U gateway -d urumi_gateway; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: create-admin
          image: "urumi-compose-gateway:latest"
          imagePullPolicy: IfNotPresent
          command:
            - node
            - apps/gateway/dist/scripts/create-admin.js
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: "urumi-gateway-secrets"
                  key: database-url
            - name: ADMIN_EMAIL
              value: "amaresh1123@gmail.com"
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: "urumi-gateway-secrets"
                  key: admin-password
          resources:
            limits:
              cpu: 500m
              memory: 512Mi
            requests:
              cpu: 100m
              memory: 128Mi
