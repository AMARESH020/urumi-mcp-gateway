# Source: urumi-gateway/templates/postgres.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: urumi-gateway-postgres-init
  labels:
    app.kubernetes.io/instance: urumi-gateway
data:
  001_initial_schema.sql: |-

    CREATE TABLE IF NOT EXISTS users (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        email TEXT NOT NULL UNIQUE,
        password_hash TEXT NOT NULL,
        role TEXT NOT NULL DEFAULT 'member'
            CHECK (role IN ('admin', 'member')),
        is_active BOOLEAN NOT NULL DEFAULT TRUE,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS api_keys (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        user_id UUID NOT NULL REFERENCES users(id) ON DELETE CASCADE,
        name TEXT NOT NULL,
        key_prefix TEXT NOT NULL,
        key_hash TEXT NOT NULL UNIQUE,
        last_used_at TIMESTAMPTZ,
        expires_at TIMESTAMPTZ,
        revoked_at TIMESTAMPTZ,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_api_keys_user_id
        ON api_keys(user_id);

    CREATE TABLE IF NOT EXISTS upstream_servers (
        id UUID PRIMARY KEY DEFAULT gen_random_uuid(),
        name TEXT NOT NULL,
        transport TEXT NOT NULL DEFAULT 'streamable_http'
            CHECK (transport IN ('streamable_http')),
        endpoint_url TEXT NOT NULL,
        is_enabled BOOLEAN NOT NULL DEFAULT TRUE,
        timeout_ms INTEGER NOT NULL DEFAULT 10000
            CHECK (timeout_ms BETWEEN 100 AND 120000),
        created_by UUID REFERENCES users(id) ON DELETE SET NULL,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW(),
        updated_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE TABLE IF NOT EXISTS audit_logs (
        id BIGINT GENERATED ALWAYS AS IDENTITY PRIMARY KEY,
        user_id UUID REFERENCES users(id) ON DELETE SET NULL,
        api_key_id UUID REFERENCES api_keys(id) ON DELETE SET NULL,
        action TEXT NOT NULL,
        resource_type TEXT NOT NULL,
        resource_id TEXT,
        outcome TEXT NOT NULL
            CHECK (outcome IN ('success', 'failure', 'denied')),
        request_id TEXT,
        details JSONB NOT NULL DEFAULT '{}'::jsonb,
        created_at TIMESTAMPTZ NOT NULL DEFAULT NOW()
    );

    CREATE INDEX IF NOT EXISTS idx_audit_logs_created_at
        ON audit_logs(created_at DESC);

    CREATE INDEX IF NOT EXISTS idx_audit_logs_user_id
        ON audit_logs(user_id);

    CREATE INDEX IF NOT EXISTS idx_upstream_servers_enabled
        ON upstream_servers(is_enabled);

  002_seed_docker_upstreams.sql: |-

    WITH candidates(name, endpoint_url) AS (
        VALUES
            ('Demo MCP Server', 'http://demo-mcp:9000/mcp'),
            ('WooCommerce MCP Server', 'http://woocommerce-mcp:9100/mcp'),
            ('Inventory MCP Server', 'http://inventory-mcp:9200/mcp')
    )
    INSERT INTO upstream_servers (name, endpoint_url, is_enabled, timeout_ms)
    SELECT c.name, c.endpoint_url, TRUE, 10000
    FROM candidates AS c
    WHERE NOT EXISTS (
        SELECT 1
        FROM upstream_servers AS existing
        WHERE existing.endpoint_url = c.endpoint_url
    );
