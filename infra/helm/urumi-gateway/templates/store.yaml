{{- if .Values.store.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-store-mariadb-data
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-mariadb
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.store.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.store.mariadbStorage | quote }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-store-wordpress-data
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-wordpress
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.store.storageClassName | quote }}
  resources:
    requests:
      storage: {{ .Values.store.wordpressStorage | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-store-mariadb
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-mariadb
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: store-mariadb
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: store-mariadb
    spec:
      containers:
        - name: mariadb
          image: {{ .Values.store.mariadbImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: mysql
              containerPort: 3306
          env:
            - name: MARIADB_DATABASE
              value: {{ .Values.store.database | quote }}
            - name: MARIADB_USER
              value: {{ .Values.store.username | quote }}
            - name: MARIADB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.storeSecret | quote }}
                  key: database-password
            - name: MARIADB_ROOT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.storeSecret | quote }}
                  key: root-password
          resources:
{{ toYaml .Values.resources.postgres | indent 12 }}
          startupProbe:
            exec:
              command:
                - sh
                - -c
                - healthcheck.sh --connect --innodb_initialized
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - healthcheck.sh --connect --innodb_initialized
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - healthcheck.sh --connect --innodb_initialized
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: mariadb-data
              mountPath: /var/lib/mysql
      volumes:
        - name: mariadb-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-store-mariadb-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-store-mariadb
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-mariadb
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-mariadb
  ports:
    - name: mysql
      port: 3306
      targetPort: mysql
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-store-wordpress
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-wordpress
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/name: store-wordpress
  template:
    metadata:
      labels:
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/name: store-wordpress
    spec:
      containers:
        - name: wordpress
          image: {{ .Values.store.wordpressImage | quote }}
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 80
          env:
            - name: WORDPRESS_DB_HOST
              value: "{{ .Release.Name }}-store-mariadb:3306"
            - name: WORDPRESS_DB_NAME
              value: {{ .Values.store.database | quote }}
            - name: WORDPRESS_DB_USER
              value: {{ .Values.store.username | quote }}
            - name: WORDPRESS_DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.storeSecret | quote }}
                  key: database-password
            - name: WORDPRESS_CONFIG_EXTRA
              value: |
                define('WP_HOME', '{{ .Values.store.scheme }}://{{ .Values.store.host }}');
                define('WP_SITEURL', '{{ .Values.store.scheme }}://{{ .Values.store.host }}');
          resources:
{{ toYaml .Values.store.wordpressResources | indent 12 }}
          startupProbe:
            httpGet:
              path: /wp-login.php
              port: http
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
            timeoutSeconds: 8
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /wp-login.php
              port: http
            initialDelaySeconds: 30
            periodSeconds: 10
            timeoutSeconds: 8
            failureThreshold: 6
          volumeMounts:
            - name: wordpress-data
              mountPath: /var/www/html
      volumes:
        - name: wordpress-data
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}-store-wordpress-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}-store-wordpress
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-wordpress
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/name: store-wordpress
  ports:
    - name: http
      port: 80
      targetPort: http
{{- if .Values.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-store-ingress
  labels:
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  ingressClassName: {{ .Values.ingress.className | quote }}
  rules:
    - host: {{ .Values.store.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ .Release.Name }}-store-wordpress
                port:
                  number: 80
{{- end }}
{{- end }}