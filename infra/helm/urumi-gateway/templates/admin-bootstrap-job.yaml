apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-admin-bootstrap
  labels:
    app.kubernetes.io/name: admin-bootstrap
    app.kubernetes.io/instance: {{ .Release.Name }}
  annotations:
    helm.sh/hook: post-install,post-upgrade
    helm.sh/hook-weight: "5"
    helm.sh/hook-delete-policy: before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: admin-bootstrap
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      restartPolicy: Never
      initContainers:
        - name: wait-for-postgres
          image: {{ .Values.postgres.image | quote }}
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              until pg_isready -h {{ .Release.Name }}-postgres -p 5432 -U {{ .Values.postgres.username }} -d {{ .Values.postgres.database }}; do
                echo "Waiting for PostgreSQL..."
                sleep 2
              done
      containers:
        - name: create-admin
          image: "{{ .Values.images.gateway.repository }}:{{ .Values.images.gateway.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command:
            - node
            - apps/gateway/dist/scripts/create-admin.js
          env:
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: database-url
            - name: ADMIN_EMAIL
              value: {{ .Values.admin.email | quote }}
            - name: ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secrets.existingSecret | quote }}
                  key: admin-password
          resources:
{{ toYaml .Values.resources.gateway | indent 12 }}